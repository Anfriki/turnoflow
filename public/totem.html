<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de turnos</title>
  <link rel="stylesheet" href="/brand.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="brand-bar">
    <img class="logo" data-brand="logo" alt="" />
    <div class="names"><span class="company" data-brand="company"></span><span class="tagline" data-brand="tagline"></span></div>
    <div class="spacer"></div>
    <div class="meta" id="branch-name"></div>
  </header>

  <main class="container" id="app">
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button role="tab" data-tab="walkin" aria-selected="true">Solicitar turno</button>
      <button role="tab" data-tab="checkin" aria-selected="false">Tengo cita</button>
      <button role="tab" data-tab="book" aria-selected="false">Agendar cita</button>
    </nav>

    <!-- Registro de entrada: 3 pasos -->
    <section data-panel="walkin" hidden>
      <ol class="wizard-steps" id="wiz-steps" aria-label="Pasos">
        <li data-step="1"><span>1</span> Identificación</li>
        <li data-step="2"><span>2</span> Dependencia</li>
        <li data-step="3"><span>3</span> Trámite</li>
      </ol>

      <form id="walkin-form" novalidate>
        <!-- Paso 1 -->
        <div class="card wiz" data-step="1">
          <div class="wiz-grid">
            <div>
              <h2 class="step"><span>1</span> Identificación del ciudadano</h2>
              <div id="walkin-citizen"></div>
            </div>
            <div class="wiz-side">
              <div id="walkin-pref"></div>
              <p class="error-msg" role="alert" data-error="1"></p>
              <button class="btn xl" type="button" data-next="2" style="width:100%">Continuar →</button>
            </div>
          </div>
        </div>

        <!-- Paso 2 -->
        <div class="card wiz" data-step="2" hidden>
          <div class="row-between">
            <h2 class="step"><span>2</span> ¿A qué dependencia corresponde su trámite?</h2>
            <span class="wiz-who muted"></span>
          </div>
          <div class="dep-grid" id="dep-options"></div>
          <div class="wiz-nav"><button class="btn ghost lg" type="button" data-back="1">← Volver</button></div>
        </div>

        <!-- Paso 3 -->
        <div class="card wiz" data-step="3" hidden>
          <div class="row-between">
            <h2 class="step"><span>3</span> Seleccione la Dirección y el trámite</h2>
            <span class="wiz-who muted"></span>
          </div>
          <p class="dep-chosen" id="dep-chosen"></p>
          <div class="dir-grid" id="dir-options" role="tablist" aria-label="Direcciones"></div>
          <div class="tramite-list" id="tramite-list" role="radiogroup" aria-label="Trámites"></div>
          <p class="error-msg" role="alert" data-error="3"></p>
          <div class="wiz-nav">
            <button class="btn ghost lg" type="button" id="back-from-3">← Volver</button>
            <button class="btn xl" type="submit" id="walkin-submit" disabled>Obtener turno</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Check-in de cita -->
    <section data-panel="checkin" hidden>
      <form id="checkin-form" class="card narrow" novalidate>
        <h2 style="margin-top:0">Registrar mi llegada</h2>
        <p class="muted">Ingrese la cédula con la que agendó su cita.</p>
        <div id="checkin-citizen"></div>
        <p class="error-msg" id="checkin-error" role="alert"></p>
        <button class="btn lg" type="submit" style="width:100%">Confirmar llegada</button>
      </form>
    </section>

    <!-- Agendar cita web -->
    <section data-panel="book" hidden>
      <form id="book-form" class="card narrow" novalidate>
        <h2 style="margin-top:0">Agendar cita</h2>
        <div id="book-citizen"></div>
        <div id="book-pref"></div>
        <div class="field" id="book-dep-wrap">
          <label>Dependencia</label>
          <div class="seg wide" role="radiogroup" id="book-dep"></div>
        </div>
        <div class="field">
          <label for="book-reason">Trámite</label>
          <select id="book-reason" required></select>
          <p class="muted reason-desc" id="book-reason-desc"></p>
        </div>
        <div class="field">
          <label for="book-date">Fecha</label>
          <input id="book-date" type="date" required />
        </div>
        <div class="field">
          <label>Horario</label>
          <div class="slots" id="slots"><span class="muted">Elija dependencia, trámite y fecha.</span></div>
        </div>
        <p class="error-msg" id="book-error" role="alert"></p>
        <button class="btn lg" type="submit" id="book-submit" disabled style="width:100%">Confirmar cita</button>
      </form>
    </section>

    <!-- Ticket emitido / seguimiento -->
    <section id="result" hidden></section>
  </main>

  <script src="/socket.io/socket.io.min.js"></script>
  <script type="module" src="/js/totem.js"></script>
</body>
</html>
