<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taquilla</title>
  <link rel="stylesheet" href="/brand.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="brand-bar">
    <img class="logo" data-brand="logo" alt="" />
    <div class="names"><span class="company" data-brand="company"></span><span class="tagline" id="desk-header">Panel de taquilla</span></div>
    <div class="spacer"></div>
    <div class="meta" id="who"></div>
  </header>

  <main class="container">
    <!-- Login -->
    <section id="login-view" hidden>
      <div class="card narrow" style="margin:40px auto;max-width:420px">
        <h2 style="margin-top:0">Ingreso de funcionarios</h2>
        <form id="login-form">
          <div class="field"><label for="email">Correo institucional</label><input id="email" type="email" required autocomplete="username" /></div>
          <div class="field"><label for="password">Contraseña</label><input id="password" type="password" required autocomplete="current-password" /></div>
          <p class="error-msg" id="login-error" role="alert"></p>
          <button class="btn lg" type="submit" style="width:100%">Ingresar</button>
        </form>
      </div>
    </section>

    <!-- Elegir taquilla -->
    <section id="desk-view" hidden>
      <div class="row-between">
        <h2>Seleccione su taquilla</h2>
        <button class="btn ghost" data-action="logout">Salir</button>
      </div>
      <div class="desk-grid" id="desk-grid"></div>
    </section>

    <!-- Panel de atención -->
    <section id="panel-view" hidden>
      <div class="row-between" style="margin-bottom:16px">
        <div>
          <h2 style="margin:0" id="desk-title"></h2>
          <span class="muted" id="desk-reasons"></span>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn ghost" data-action="release">Liberar taquilla</button>
          <button class="btn ghost" data-action="logout">Salir</button>
        </div>
      </div>
      <div class="op-layout">
        <div class="card current-ticket" id="current"></div>
        <div class="card">
          <h3 style="margin-top:0">Ciudadanos en espera</h3>
          <p class="muted" id="queue-totals"></p>
          <ul class="queue-list" id="queue"></ul>
          <p class="muted" style="margin-bottom:0">Atendidos hoy por usted: <strong id="attended">0</strong></p>
          <p class="muted" style="font-size:.85rem">Atajos: <kbd>Espacio</kbd> llamar · <kbd>I</kbd> iniciar · <kbd>F</kbd> finalizar · <kbd>R</kbd> re-llamar · <kbd>A</kbd> ausente</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal obligatorio de cierre de atención -->
  <dialog id="finish-dialog" class="modal" aria-labelledby="finish-title">
    <form method="dialog" id="finish-form" novalidate>
      <h2 id="finish-title" style="margin-top:0">Finalizar atención <span id="finish-code"></span></h2>
      <p class="muted" id="finish-citizen"></p>
      <fieldset class="field">
        <legend>Estatus de la petición</legend>
        <div class="resolution-grid" id="resolution-options"></div>
      </fieldset>
      <div class="field" id="destination-wrap" hidden>
        <label for="destination">Remitido a (Dirección, unidad u organismo)</label>
        <input id="destination" list="departments" maxlength="150" autocomplete="off" />
        <datalist id="departments"></datalist>
      </div>
      <div class="field">
        <label for="notes">Observaciones / resolución <span class="muted" id="notes-count"></span></label>
        <textarea id="notes" rows="4" maxlength="2000" placeholder="Resuma qué se le informó o qué trámite se le gestionó al ciudadano."></textarea>
      </div>
      <p class="error-msg" id="finish-error" role="alert"></p>
      <div class="row-between">
        <button type="button" class="btn ghost" value="cancel" id="finish-cancel">Volver</button>
        <button type="submit" class="btn success lg" id="finish-submit">Guardar y finalizar</button>
      </div>
    </form>
  </dialog>

  <script src="/socket.io/socket.io.min.js"></script>
  <script type="module" src="/js/operator.js"></script>
</body>
</html>
